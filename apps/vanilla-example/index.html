<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>plink · Vanilla example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 0 auto;
        padding: 48px 24px;
        color: #eef0f4;
        background: #0a0a0d;
      }
      h1 {
        font-weight: 640;
      }
      p {
        color: #9a9aab;
      }
      button {
        font-family: ui-monospace, monospace;
        font-size: 14px;
        background: #1a1a23;
        color: #eef0f4;
        border: 1px solid #2d2d3a;
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
        margin: 0 8px 8px 0;
      }
      button:hover {
        border-color: #e0417f;
      }
    </style>
  </head>
  <body>
    <h1>plink · vanilla JS</h1>
    <p>Every button plays a sound synthesised at runtime — no audio files loaded.</p>
    <div id="presets"></div>
    <h3>Custom sound</h3>
    <button id="custom">play a doorbell spec</button>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
