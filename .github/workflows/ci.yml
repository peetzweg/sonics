name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: unit tests
        run: pnpm --filter=sonics test

      - name: build library
        run: pnpm --filter=sonics build

      - name: validate package (publint + are-the-types-wrong)
        run: pnpm --filter=sonics lint:pkg

      - name: build site + example apps
        run: |
          pnpm --filter=site build
          pnpm --filter=react-example build
          pnpm --filter=vanilla-example build
          pnpm --filter=vue-example build

  consume-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=sonics build
      - name: import the built package (esm + cjs)
        run: pnpm --filter=consume-tests smoke

  consume-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=sonics build
      - name: import the built package under bun (esm + cjs)
        working-directory: tests/consume
        run: |
          bun run ./esm.mjs
          bun run ./cjs.cjs
